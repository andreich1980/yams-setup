networks:
  default:
    external: true
    name: yams_network
  ts-hub-net:
    driver: bridge

volumes:
  ts-socket-hub:

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - HOMEPAGE_ALLOWED_HOSTS=192.168.68.114,media.tilapia-smelt.ts.net
    volumes:
      - ${INSTALL_DIRECTORY}/config/homepage:/app/config
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - ts-hub-net

  jellyfin-tailscale:
    image: tailscale/tailscale:latest
    container_name: jellyfin-tailscale
    hostname: cinema # name for TailScale URL
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TZ=Europe/Moscow
    volumes:
      - ${INSTALL_DIRECTORY}/config/tailscale/tailscale-data/jellyfin:/var/lib/tailscale # to use the same IP
      - ${INSTALL_DIRECTORY}/config/tailscale/sidecars/jellyfin.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun # for VPN to work inside the container
    ports:
      - 8096:8096 # Port for local access
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
    volumes:
      - ${INSTALL_DIRECTORY}/config/audiobookshelf:/config
      - ${MEDIA_DIRECTORY}/audiobooks:/audiobooks
      - ${MEDIA_DIRECTORY}/podcasts:/podcasts
      - ${INSTALL_DIRECTORY}/metadata/audiobookshelf:/metadata
    ports:
      - 13378:80
    restart: unless-stopped

  # TS hub for reverse proxying services like sornarr/radarr/etc.
  tailscale-hub:
    image: tailscale/tailscale:latest
    container_name: tailscale-hub
    hostname: media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TZ=Europe/Moscow
    volumes:
      - ${INSTALL_DIRECTORY}/config/tailscale/hub:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ts-socket-hub:/var/run/tailscale # for Caddy to read the socket
    ports:
      - 80:80
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      - ts-hub-net
    restart: unless-stopped

  # Reverse proxy for the TS hub
  caddy-hub:
    image: caddy:latest
    container_name: caddy-hub
    restart: unless-stopped
    network_mode: service:tailscale-hub
    depends_on:
      - tailscale-hub
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ${INSTALL_DIRECTORY}/config/caddy/data:/data
      - ts-socket-hub:/var/run/tailscale # Read the TS socket
    environment:
      - CADDY_DOCKER_PROXY_URL=/var/run/tailscale/tailscaled.sock
