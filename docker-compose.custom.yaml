networks:
  default:
    external: true
    name: yams_network

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: jellyfin-server # name for TailScale
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TZ=Europe/Moscow
    volumes:
      - ${INSTALL_DIRECTORY}/config/tailscale/tailscale-data:/var/lib/tailscale # to use the same IP
      - /dev/net/tun:/dev/net/tun # for VPN to work inside the container
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    # Jellyfin ports are here, instead of its container, so it works via local network
    ports:
      - 8096:8096

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
    volumes:
      - ${INSTALL_DIRECTORY}/config/audiobookshelf:/config
      - ${MEDIA_DIRECTORY}/audiobooks:/audiobooks
      - ${MEDIA_DIRECTORY}/podcasts:/podcasts
      - ${INSTALL_DIRECTORY}/metadata/audiobookshelf:/metadata
    ports:
      - 13378:80
    restart: unless-stopped
