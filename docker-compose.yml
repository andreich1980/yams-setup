services:
  # --- Tailscale Hub & Reverse Proxy ---
  tailscale-hub:
    image: tailscale/tailscale:latest
    container_name: tailscale-hub
    hostname: media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TZ=Europe/Moscow
    volumes:
      - ts_hub_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ts-socket-hub:/var/run/tailscale
    ports:
      - 80:80
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      - internal
    restart: unless-stopped

  caddy-hub:
    image: caddy:latest
    container_name: caddy-hub
    restart: unless-stopped
    network_mode: service:tailscale-hub
    depends_on:
      - tailscale-hub
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ts-socket-hub:/var/run/tailscale
    environment:
      - CADDY_DOCKER_PROXY_URL=/var/run/tailscale/tailscaled.sock
      - TS_DOMAIN=${TS_DOMAIN}

  # --- Media Stack (Sidecars) ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
      - VERSION=docker
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ./config/jellyfin:/config
    restart: unless-stopped
    network_mode: service:jellyfin-tailscale

  jellyfin-tailscale:
    image: tailscale/tailscale:latest
    container_name: jellyfin-tailscale
    hostname: cinema
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TZ=Europe/Moscow
    volumes:
      - ts_jellyfin_data:/var/lib/tailscale
      - ./config/tailscale/sidecars/jellyfin.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8096:8096
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
    volumes:
      - ./config/audiobookshelf:/config
      - ${MEDIA_DIRECTORY}/audiobooks:/audiobooks
      - ${MEDIA_DIRECTORY}/podcasts:/podcasts
      - ./metadata/audiobookshelf:/metadata
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped
    network_mode: service:audiobookshelf-tailscale

  audiobookshelf-tailscale:
    image: tailscale/tailscale:latest
    container_name: audiobookshelf-tailscale
    hostname: books
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TZ=Europe/Moscow
    volumes:
      - ts_books_data:/var/lib/tailscale
      - ./config/tailscale/sidecars/audiobookshelf.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    ports:
      - 13378:80
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.10.2
    container_name: mealie
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
      - ALLOW_SIGNUP=false
      - BASE_URL=${LOCAL_IP}:9925,https://food.${TS_DOMAIN}/
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./config/mealie:/app/data
    network_mode: service:mealie-tailscale
    deploy:
      resources:
        limits:
          memory: 1000M

  mealie-tailscale:
    image: tailscale/tailscale:latest
    container_name: mealie-tailscale
    hostname: food
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TS_AUTHKEY=${TAILSCALE_AUTH_KEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
      - TZ=Europe/Moscow
    volumes:
      - ts_food_data:/var/lib/tailscale
      - ./config/tailscale/sidecars/mealie.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    ports:
      - 9925:9000
    cap_add: [NET_ADMIN, NET_RAW]
    restart: unless-stopped

  # --- Arr Stack & Hub Services ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:4.6.3
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
      - WEBUI_PORT=8081
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ./config/qbittorrent:/config
    restart: unless-stopped
    ports:
      - 8081:8081
    networks:
      - internal

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ./config/sonarr:/config
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - internal

  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ./config/radarr:/config
    ports:
      - 7878:7878
    restart: unless-stopped
    networks:
      - internal

  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MEDIA_DIRECTORY}:/data
      - ./config/bazarr:/config
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - internal

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - internal

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=Europe/Moscow
      - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
      - HOMEPAGE_VAR_TS_DOMAIN=${TS_DOMAIN}
      - HOMEPAGE_VAR_LOCAL_IP=${LOCAL_IP}
    volumes:
      - ./config/homepage:/app/config
    ports:
      - 3000:3000
    restart: unless-stopped
    networks:
      - internal

  # --- Maintenance ---
  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    environment:
      - WATCHTOWER_CLEANUP=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    name: internal_network
    driver: bridge

volumes:
  ts-socket-hub:
  ts_hub_data:
  ts_jellyfin_data:
  ts_books_data:
  ts_food_data:
  caddy_data:
  caddy_config:
